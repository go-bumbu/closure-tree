name: golang
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 1.25.x is the minimum go.mod declares; stable is the latest release.
        go-version: ['1.25.x', 'stable']
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4
      ## Setup GO
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: run tests
        run: make test

      - name: run tests with the race detector
        run: make test-race

      - name: ensure test coverage
        run: make coverage

