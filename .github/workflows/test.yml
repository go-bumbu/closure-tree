name: golang
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # go.mod declares go 1.25.14; 1.25.x takes the latest 1.25 patch, stable the latest release.
        go-version: ['1.25.x', 'stable']
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4
      ## Setup GO
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: run tests
        run: make test

      - name: run tests with the race detector
        run: make test-race

      - name: ensure test coverage
        run: make coverage

